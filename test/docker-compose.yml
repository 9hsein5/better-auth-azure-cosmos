services:
  cosmos:
    # vnext-preview is the Linux emulator build that supports hierarchical
    # partition keys, which the single-container layout depends on.
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: better-auth-cosmos-emulator
    ports:
      - "8081:8081"
    environment:
      PROTOCOL: https
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ready | grep -Eq '\"ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
